version: "2"

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - revive
    - gocritic
    - durationcheck
    - errorlint
    - copyloopvar
    - nilerr
    - unconvert
    - whitespace
    - misspell
  settings:
    revive:
      rules:
        - name: exported
          disabled: true  # too noisy for existing codebase
        - name: var-naming
          disabled: true  # PING_TIMEOUT, underscore packages, ID suffixes are established
        - name: unexported-return
          disabled: true
        - name: package-comments
          disabled: true  # too noisy for existing codebase
        - name: dot-imports
          disabled: true  # Ginkgo/Gomega use dot imports by convention
    govet:
      enable:
        - shadow
    gocritic:
      disabled-checks:
        - ifElseChain
        - singleCaseSwitch
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
      - ".*_grpc\\.pb\\.go$"
    rules:
      - linters:
          - errcheck
        path: "_test\\.go$"
      - linters:
          - govet
        text: "shadow"
        path: "_test\\.go$"
