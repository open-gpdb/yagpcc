# --------------------------------------------------------------------
# GitHub Actions Workflow: Yagpcc Test Pipeline
# --------------------------------------------------------------------
# Description:
#
#   Builds yagpcc, runs golangci-lint, then runs `make unittest` (Ginkgo CLI,
#   ./..., race). Ginkgo --github-output integrates with Actions logs.

name: Go unit tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  tests:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: [ '1.25' ]

    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Install buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: Check generated proto files are up to date
        run: |
          make genproto
          git diff --exit-code -- '*.pb.go' || {
            echo "::error::Generated proto files are out of date. Run 'make genproto' and commit the result."
            exit 1
          }
      - name: Download modules
        run: go mod download
      - name: Check if builds successfully
        run: go build ./...
      - name: Linter checks
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.6
      - name: Unit tests (all packages)
        run: make unittest

  clickhouse-integration:
    # Heavier than the unit-test job: runs the JSON→column mapping and the
    # standalone production DDL against a real ClickHouse via the `integration`
    # build tag. The server is provided as a service container and its native
    # port is handed to the test through YAGPCC_CH_ADDR.
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      matrix:
        go-version: ['1.25']
    services:
      clickhouse:
        image: clickhouse/clickhouse-server:24.3
        ports:
          - 9000:9000
        options: >-
          --health-cmd "clickhouse-client --query 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
      - name: Download modules
        run: go mod download
      - name: ClickHouse sink integration tests
        env:
          YAGPCC_CH_ADDR: 127.0.0.1:9000
        run: go test -tags=integration -v -count=1 -timeout=10m ./internal/sink/clickhouse/...
